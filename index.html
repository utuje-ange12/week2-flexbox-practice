<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 2 Flexbox Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Part 1: boxes move through all 9 positions (row layout) -->
  <section class="container container--nine">
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
    <div class="box box4">Box 4</div>
    <div class="box box5">Box 5</div>
    <div class="box box6">Box 6</div>
  </section>

  <!-- Part 2: extra layout using flex-direction: column + flex-wrap: wrap -->
  <section class="container container--column">
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
    <div class="box box4">Box 4</div>
    <div class="box box5">Box 5</div>
    <div class="box box6">Box 6</div>
  </section>

</body>
</html>
